
name: Update all A-share breadth and TRIN

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ashare-verified-collector-v4
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Backfill 80 sessions and calculate SMA20 SMA60 TRIN
        run: python update_data.py

      - name: Commit verified market data and backfill cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Update real A-share breadth SMA20 SMA60"
            git push
          fi

      - name: Prepare static website
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/market.json site/data/market.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
