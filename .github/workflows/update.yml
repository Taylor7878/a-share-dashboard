
name: Update A-share SMA20 SMA60 TRIN CSI300 PCR

on:
  workflow_dispatch:

  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ashare-market-data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "akshare>=1.16"

      - name: Update real A-share SMA20 SMA60 and TRIN
        run: python update_data.py

      - name: Collect real CSI300 index history
        continue-on-error: true
        run: python collect_hs300.py

      - name: Collect SSE and SZSE ETF option PCR
        continue-on-error: true
        run: python collect_options_pcr.py

      - name: Check generated data files
        run: |
          echo "Checking published data:"
          ls -lh data/
          test -s data/market.json

          if [ -s data/hs300.json ]; then
            echo "HS300_FILE_READY"
          else
            echo "::warning::HS300 data unavailable"
          fi

          if [ -s data/options_pcr.json ]; then
            echo "ETF_PCR_FILE_READY"
          else
            echo "::warning::ETF PCR data unavailable"
          fi

      - name: Save market data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if ! git diff --cached --quiet; then
            git commit -m "Update A-share and options data"
            git push
          fi

      - name: Prepare static website
        run: |
          mkdir -p site/data

          cp index.html site/index.html
          cp data/market.json site/data/market.json

          if [ -s data/hs300.json ]; then
            cp data/hs300.json site/data/hs300.json
          fi

          if [ -s data/options_pcr.json ]; then
            cp data/options_pcr.json site/data/options_pcr.json
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
