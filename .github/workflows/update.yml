
name: Update all A-share breadth and TRIN

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update SMA20 SMA60 and TRIN
        run: python update_data.py

      - name: Collect real CSI300 history
        continue-on-error: true
        run: python collect_hs300.py

      - name: Save market and index data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Update A-share and CSI300 market data"
            git push
          fi

      - name: Prepare website files
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/market.json site/data/market.json

          if [ -f data/hs300.json ]; then
            cp data/hs300.json site/data/hs300.json
          fi

          if [ -f data/options_pcr.json ]; then
            cp data/options_pcr.json site/data/options_pcr.json
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v4
