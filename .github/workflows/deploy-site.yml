
name: Deploy A-share Dashboard Website

on:
  push:
    branches:
      - main
    paths:
      - index.html

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/market.json site/data/market.json

          if [ -f data/hs300.json ]; then
            cp data/hs300.json site/data/hs300.json
          fi

          if [ -f data/options_pcr.json ]; then
            cp data/options_pcr.json site/data/options_pcr.json
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
